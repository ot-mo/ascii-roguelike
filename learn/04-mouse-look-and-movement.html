<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage 4 · Mouse Look and Movement</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
/*
  STAGE 4 — Feels like an FPS: mouse look, jumping, real collision
  =================================================================
  New in this stage:
    • Mouse look with the Pointer Lock API (click to capture the mouse, Esc to release).
    • Mouse wheel zooms (changes the field of view). 1 / 2 change mouse sensitivity.
    • Physics: gravity, jumping (Space), sprinting (Shift).
    • Proper 3D collision: the player is a box (a "capsule-ish" AABB) that is pushed
      out of blocks one axis at a time — so you slide along walls, land on crates,
      bump your head on doorframes, and can climb the stairs up onto the roof.
    • A minimap and an FPS counter.

  The screen code (section 1), world (section 3) and ray casting (section 6)
  are unchanged from stage 3.
*/

// ===========================================================================
// 1. The character screen   (unchanged from stage 1)
// ===========================================================================
const RAMP = " .:-=+*#%@";
const MAX_COLS = 180;

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

let cols, rows, cellW, cellH, chars, colors, image, pixels;
const glyphs = new Map();

function resize() {
  ctx.font = "bold 100px monospace";
  const charAspect = ctx.measureText("M").width / 100;
  const dpr = window.devicePixelRatio || 1;
  const screenW = Math.floor(window.innerWidth * dpr);
  const screenH = Math.floor(window.innerHeight * dpr);
  cellW = Math.max(6, Math.ceil(screenW / MAX_COLS));
  cellH = Math.round(cellW / charAspect);
  cols = Math.floor(screenW / cellW);
  rows = Math.floor(screenH / cellH);
  canvas.width = cols * cellW;
  canvas.height = rows * cellH;
  canvas.style.width = canvas.width / dpr + "px";
  canvas.style.height = canvas.height / dpr + "px";
  image = ctx.createImageData(canvas.width, canvas.height);
  pixels = new Uint32Array(image.data.buffer);
  glyphs.clear();
  chars = new Array(cols * rows).fill(" ");
  colors = new Uint8ClampedArray(cols * rows * 3);
}

function clear() { chars.fill(" "); colors.fill(0); }

function put(x, y, ch, r, g, b) {
  if (x < 0 || y < 0 || x >= cols || y >= rows) return;
  const i = y * cols + x;
  chars[i] = ch;
  colors[i * 3] = r; colors[i * 3 + 1] = g; colors[i * 3 + 2] = b;
}

function text(x, y, str, r = 220, g = 220, b = 220) {
  for (let k = 0; k < str.length; k++) put(x + k, y, str[k], r, g, b);
}

function rampChar(L) {
  const k = Math.floor(L * RAMP.length);
  return RAMP[Math.max(0, Math.min(RAMP.length - 1, k))];
}

function glyph(ch) {
  let g = glyphs.get(ch);
  if (!g) {
    const c = document.createElement("canvas");
    c.width = cellW; c.height = cellH;
    const gctx = c.getContext("2d", { willReadFrequently: true });
    gctx.font = `bold ${cellH}px monospace`;
    gctx.textBaseline = "top";
    gctx.fillStyle = "#fff";
    gctx.fillText(ch, 0, 0);
    const rgba = gctx.getImageData(0, 0, cellW, cellH).data;
    g = new Uint8Array(cellW * cellH);
    for (let k = 0; k < g.length; k++) g[k] = rgba[k * 4 + 3];
    glyphs.set(ch, g);
  }
  return g;
}

function present() {
  pixels.fill(0xff000000);
  const W = canvas.width;
  for (let cy = 0; cy < rows; cy++) {
    for (let cx = 0; cx < cols; cx++) {
      const i = cy * cols + cx;
      const ch = chars[i];
      if (ch === " ") continue;
      const g = glyph(ch);
      const r = colors[i * 3], gr = colors[i * 3 + 1], b = colors[i * 3 + 2];
      let k = 0;
      for (let py = 0; py < cellH; py++) {
        let p = (cy * cellH + py) * W + cx * cellW;
        for (let px = 0; px < cellW; px++, k++, p++) {
          const a = g[k];
          if (a) pixels[p] = 0xff000000 | ((b * a >> 8) << 16) | ((gr * a >> 8) << 8) | (r * a >> 8);
        }
      }
    }
  }
  ctx.putImageData(image, 0, 0);
}

// ===========================================================================
// 2. Input: keyboard + mouse look
// ===========================================================================
const keys = new Set();
let sensitivity = 0.0025;   // radians of turn per pixel of mouse movement
let fovDeg = 75;            // horizontal field of view; mouse wheel changes it
let showMap = true;         // M toggles the minimap

addEventListener("keydown", (e) => {
  keys.add(e.code);
  if (e.code === "Space" || e.code.startsWith("Arrow")) e.preventDefault();   // don't scroll the page
  if (e.code === "Digit1") sensitivity = Math.max(0.0005, sensitivity / 1.25);
  if (e.code === "Digit2") sensitivity = Math.min(0.01, sensitivity * 1.25);
  if (e.code === "KeyM") showMap = !showMap;
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("blur", () => keys.clear());

/*
  Pointer Lock: after a click, the browser hides the cursor, stops it from
  hitting the screen edge, and reports how far the mouse MOVED each event
  (movementX / movementY). That's how every browser FPS does mouse look.
  Browsers only allow it in response to a click, and Esc always releases it.
*/
canvas.addEventListener("click", () => {
  const p = canvas.requestPointerLock();
  if (p && p.catch) p.catch(() => {});   // newer browsers return a promise; ignore refusals
});
addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== canvas) return;
  player.yaw += e.movementX * sensitivity;
  player.pitch -= e.movementY * sensitivity;   // mouse forward (up) = look up
  clampPitch();
});
addEventListener("wheel", (e) => {
  fovDeg = Math.max(30, Math.min(110, fovDeg + Math.sign(e.deltaY) * 5));
});

// ===========================================================================
// 3. The 3D world   (unchanged from stage 3)
// ===========================================================================
const LAYERS = [
  [ // z = 0 — the ground: tiles in the hall, planks in the brick room, grass outside
    "################",
    "#TTTTTTT#GGGGGG#",
    "#TTTTTTT#GGGGGG#",
    "#TTTTTTT#GGGGGG#",
    "#TTTTTTTTGGGGGG#",
    "#TTTTTTT#GGGGGG#",
    "#TTTTTTT#GGGGGG#",
    "#TTTTTTT#GGGGGG#",
    "####T####GGGGGG#",
    "#PPPPPPP#GGGGGG#",
    "#PPPPPPP#GGGGGG#",
    "#PPPPPPP#GGGGGG#",
    "#PPPPPPP#GGGGGG#",
    "#PPPPPPPPGGGGGG#",
    "#PPPPPPP#GGGGGG#",
    "################",
  ],
  [ // z = 1 — feet level: walls, marble columns (C), crates (W), stairs, doorways
    "#########MMMMMMM",
    "#.......#......M",
    "#.C...C.#......M",
    "#.......#...#..M",
    "#..............M",
    "#.......##.....M",
    "#.C...C.##.....M",
    "#.......##.....M",
    "####.####......M",
    "B.......B...M..M",
    "B.WW....B...M..M",
    "B.W.....B...M..M",
    "B.......B...M.WM",
    "B.............WM",
    "B.......B......M",
    "BBBBBBBBBMMMMMMM",
  ],
  [ // z = 2 — eye level: lamps (L) in the walls, windows into the courtyard
    "####L####MMMMMMM",
    "#.......#......M",
    "L.C...C.#......M",
    "#.......#...#..M",
    "#..............M",
    "#.......##.....M",
    "L.C...C.##.....M",
    "#.......#......M",
    "####.####......M",
    "B.......B...M..M",
    "B.W.........M..M",
    "B..............M",
    "L.......B......M",
    "B..............M",
    "B.......B......M",
    "BBBBLBBBBMMMMMMM",
  ],
  [ // z = 3 — above the doorways (lintels close them), courtyard walls end
    "#########.......",
    "#.......#.......",
    "#.C...C.#.......",
    "#.......#...#...",
    "#.......#.......",
    "#.......##......",
    "#.C...C.#.......",
    "#.......#.......",
    "#########.......",
    "B.......B.......",
    "B.......B.......",
    "B.......B.......",
    "B.......B.......",
    "B.......B.......",
    "B.......B.......",
    "BBBBBBBBB.......",
  ],
  [ // z = 4 — the roof (R) with a skylight over the hall, and a lamp on the courtyard pillar
    "RRRRRRRRR.......",
    "RRRRRRRRR.......",
    "RRRRRRRRR.......",
    "RRR...RRR...L...",
    "RRR...RRR.......",
    "RRR...RRR.......",
    "RRRRRRRRR.......",
    "RRRRRRRRR.......",
    "RRRRRRRRR.......",
    "RRRRRRRRR.......",
    "RRRRRRRRR.......",
    "RRRRRRRRR.......",
    "RRRRRRRRR.......",
    "RRRRRRRRR.......",
    "RRRRRRRRR.......",
    "RRRRRRRRR.......",
  ],
];

const BLOCK_TYPES = {
  "#": [150, 150, 165],   // stone
  "B": [190, 85, 55],     // brick
  "W": [170, 115, 60],    // wooden crate
  "M": [85, 160, 90],     // mossy stone
  "C": [220, 215, 205],   // marble column
  "T": [180, 165, 140],   // floor tiles
  "G": [90, 155, 60],     // grass
  "P": [140, 95, 55],     // wooden planks
  "R": [165, 70, 55],     // roof tiles
  "L": [255, 215, 130],   // lamp (glows)
};

const WORLD_W = LAYERS[0][0].length;
const WORLD_D = LAYERS[0].length;
const WORLD_H = LAYERS.length;
const BLOCK_CHARS = Object.keys(BLOCK_TYPES);
const BLOCK_COLOR = [null, ...BLOCK_CHARS.map((c) => BLOCK_TYPES[c])];
const LAMP = BLOCK_CHARS.indexOf("L") + 1;
const world = new Uint8Array(WORLD_W * WORLD_D * WORLD_H);
for (let z = 0; z < WORLD_H; z++)
  for (let y = 0; y < WORLD_D; y++)
    for (let x = 0; x < WORLD_W; x++)
      world[x + y * WORLD_W + z * WORLD_W * WORLD_D] = BLOCK_CHARS.indexOf(LAYERS[z][y][x]) + 1;

function blockAt(x, y, z) {
  if (x < 0 || y < 0 || z < 0 || x >= WORLD_W || y >= WORLD_D || z >= WORLD_H) return 0;
  return world[x + y * WORLD_W + z * WORLD_W * WORLD_D];
}

// ===========================================================================
// 4. The player
// ===========================================================================
const RADIUS = 0.3;       // half the body's width
const HEIGHT = 1.6;       // feet to top of head (doorways are 2 blocks tall)
const EYE_HEIGHT = 1.45;  // feet to eyes
const WALK_SPEED = 4.5, SPRINT_SPEED = 8;   // blocks per second
const GRAVITY = 24;       // blocks per second²
const JUMP_SPEED = 8.2;   // jump height = JUMP_SPEED² / (2·GRAVITY) ≈ 1.4 blocks

const player = { x: 2.5, y: 4.5, z: 1, vz: 0, onGround: false, yaw: 0, pitch: 0 };

function clampPitch() {
  const LIMIT = 89 * Math.PI / 180;   // exactly ±90° would make "forward" and "up" collapse
  player.pitch = Math.max(-LIMIT, Math.min(LIMIT, player.pitch));
}

// ===========================================================================
// 5. Physics: an axis-aligned box pushed out of blocks one axis at a time
// ===========================================================================
// For collision, the edge of the world counts as solid, and above the top layer is open sky.
function solidAt(x, y, z) {
  if (z >= WORLD_H) return false;
  if (x < 0 || y < 0 || z < 0 || x >= WORLD_W || y >= WORLD_D) return true;
  return blockAt(x, y, z) !== 0;
}

// Does the player's box overlap any solid block?
function bodyCollides() {
  const x0 = Math.floor(player.x - RADIUS), x1 = Math.floor(player.x + RADIUS);
  const y0 = Math.floor(player.y - RADIUS), y1 = Math.floor(player.y + RADIUS);
  const z0 = Math.floor(player.z), z1 = Math.floor(player.z + HEIGHT);
  for (let z = z0; z <= z1; z++)
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++)
        if (solidAt(x, y, z)) return true;
  return false;
}

/*
  Move along ONE axis. If that pushes us into a block, snap back so we're
  exactly touching the block's face. Doing x, y and z separately is what makes
  sliding along walls (and landing on things) work with almost no code.
*/
const EPS = 0.001;
function moveAxis(axis, amount) {
  if (amount === 0) return;
  player[axis] += amount;
  if (!bodyCollides()) return;

  const p = player[axis];
  if (axis === "z") {
    if (amount < 0) { player.z = Math.floor(p) + 1; player.onGround = true; }   // landed on a block's top
    else player.z = Math.floor(p + HEIGHT) - HEIGHT - EPS;                      // bumped our head
    player.vz = 0;
  } else {
    player[axis] = amount > 0
      ? Math.floor(p + RADIUS) - RADIUS - EPS        // stop just before the block on our + side
      : Math.floor(p - RADIUS) + 1 + RADIUS + EPS;   // stop just after the block on our − side
  }
}

function update(dt) {
  // Arrow keys still look around (handy without a mouse).
  const LOOK = 2.0 * dt;
  if (keys.has("ArrowLeft")) player.yaw -= LOOK;
  if (keys.has("ArrowRight")) player.yaw += LOOK;
  if (keys.has("ArrowUp")) player.pitch += LOOK;
  if (keys.has("ArrowDown")) player.pitch -= LOOK;
  clampPitch();

  // Which way do we want to walk? (Flat: looking down shouldn't slow you down.)
  const fx = Math.cos(player.yaw), fy = Math.sin(player.yaw);
  const rx = -fy, ry = fx;
  let mx = 0, my = 0;
  if (keys.has("KeyW")) { mx += fx; my += fy; }
  if (keys.has("KeyS")) { mx -= fx; my -= fy; }
  if (keys.has("KeyD")) { mx += rx; my += ry; }
  if (keys.has("KeyA")) { mx -= rx; my -= ry; }
  const len = Math.hypot(mx, my);
  const speed = keys.has("ShiftLeft") || keys.has("ShiftRight") ? SPRINT_SPEED : WALK_SPEED;
  if (len > 0) { mx = (mx / len) * speed; my = (my / len) * speed; }

  if (keys.has("Space") && player.onGround) player.vz = JUMP_SPEED;

  // Small sub-steps, so even a fast fall can't skip through a whole block in one frame.
  const steps = Math.ceil(dt / 0.008);
  const h = dt / steps;
  for (let s = 0; s < steps; s++) {
    player.vz = Math.max(player.vz - GRAVITY * h, -30);
    moveAxis("x", mx * h);
    moveAxis("y", my * h);
    player.onGround = false;
    moveAxis("z", player.vz * h);
  }
}

// ===========================================================================
// 6. Casting one ray in 3D   (unchanged from stage 3)
// ===========================================================================
let hitT, hitBlock, hitNX, hitNY, hitNZ;

function castRay(ox, oy, oz, dx, dy, dz, maxT) {
  let x = Math.floor(ox), y = Math.floor(oy), z = Math.floor(oz);
  const stepX = dx > 0 ? 1 : -1, stepY = dy > 0 ? 1 : -1, stepZ = dz > 0 ? 1 : -1;
  const tDeltaX = Math.abs(1 / dx), tDeltaY = Math.abs(1 / dy), tDeltaZ = Math.abs(1 / dz);
  let tMaxX = dx === 0 ? Infinity : (dx > 0 ? x + 1 - ox : ox - x) * tDeltaX;
  let tMaxY = dy === 0 ? Infinity : (dy > 0 ? y + 1 - oy : oy - y) * tDeltaY;
  let tMaxZ = dz === 0 ? Infinity : (dz > 0 ? z + 1 - oz : oz - z) * tDeltaZ;
  let axis = 0;

  while (true) {
    if (tMaxX < tMaxY && tMaxX < tMaxZ) { x += stepX; hitT = tMaxX; tMaxX += tDeltaX; axis = 0; }
    else if (tMaxY < tMaxZ)             { y += stepY; hitT = tMaxY; tMaxY += tDeltaY; axis = 1; }
    else                                { z += stepZ; hitT = tMaxZ; tMaxZ += tDeltaZ; axis = 2; }
    if (hitT > maxT) return false;
    if ((x < 0 && stepX < 0) || (x >= WORLD_W && stepX > 0) ||
        (y < 0 && stepY < 0) || (y >= WORLD_D && stepY > 0) ||
        (z < 0 && stepZ < 0) || (z >= WORLD_H && stepZ > 0)) return false;
    const b = blockAt(x, y, z);
    if (b) {
      hitBlock = b;
      hitNX = axis === 0 ? -stepX : 0;
      hitNY = axis === 1 ? -stepY : 0;
      hitNZ = axis === 2 ? -stepZ : 0;
      return true;
    }
  }
}

// ===========================================================================
// 7. Render   (the 3D view is unchanged from stage 3; new: minimap + HUD)
// ===========================================================================
const MAX_DIST = 24;

function render() {
  clear();

  const cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
  const cyaw = Math.cos(player.yaw), syaw = Math.sin(player.yaw);
  const fX = cp * cyaw, fY = cp * syaw, fZ = sp;
  const rX = -syaw, rY = cyaw;
  const uX = -sp * cyaw, uY = -sp * syaw, uZ = cp;
  const halfW = Math.tan(fovDeg * Math.PI / 360);
  const halfH = halfW * (rows * cellH) / (cols * cellW);
  const ex = player.x, ey = player.y, ez = player.z + EYE_HEIGHT;

  for (let cy = 0; cy < rows; cy++) {
    const v = (1 - 2 * (cy + 0.5) / rows) * halfH;
    for (let cx = 0; cx < cols; cx++) {
      const u = (2 * (cx + 0.5) / cols - 1) * halfW;
      let dx = fX + u * rX + v * uX;
      let dy = fY + u * rY + v * uY;
      let dz = fZ + v * uZ;
      const len = Math.hypot(dx, dy, dz);
      dx /= len; dy /= len; dz /= len;

      if (castRay(ex, ey, ez, dx, dy, dz, MAX_DIST)) {
        let L;
        if (hitBlock === LAMP) L = 1;
        else {
          const face = hitNZ > 0 ? 1.0 : hitNZ < 0 ? 0.45 : hitNX !== 0 ? 0.8 : 0.62;
          L = face * Math.max(0, 1 - hitT / MAX_DIST);
        }
        const [r, g, b] = BLOCK_COLOR[hitBlock];
        put(cx, cy, rampChar(L), r * L, g * L, b * L);
      } else if (dz < 0) {
        const t = (1 - ez) / dz;
        const L = 0.7 * Math.max(0, 1 - t / (MAX_DIST * 2));
        put(cx, cy, rampChar(L), 90 * L, 155 * L, 60 * L);
      } else {
        const L = 0.42 - 0.2 * dz;
        put(cx, cy, rampChar(L), 120 - 70 * dz, 160 - 70 * dz, 230 - 30 * dz);
      }
    }
  }

  put(cols >> 1, rows >> 1, "+", 255, 255, 255);
  drawMinimap();
  drawHud();
}

// A top-down slice at body height: bright = blocks in your way, dim = what you'd walk on.
function drawMinimap() {
  if (!showMap || cols < 110) return;   // hidden, or the window is too narrow to spare the space
  const ox = cols - WORLD_W * 2 - 2, oy = 4;
  const zf = Math.floor(player.z);   // the layer our feet are in
  for (let y = 0; y < WORLD_D; y++) {
    for (let x = 0; x < WORLD_W; x++) {
      const wall = blockAt(x, y, zf) || blockAt(x, y, zf + 1);
      const below = blockAt(x, y, zf - 1);
      let ch = " ", r = 0, g = 0, b = 0;
      if (wall) { ch = "#"; [r, g, b] = BLOCK_COLOR[wall]; }
      else if (below) { ch = "."; [r, g, b] = BLOCK_COLOR[below].map((c) => c * 0.5); }
      put(ox + x * 2, oy + y, ch, r, g, b);
      put(ox + x * 2 + 1, oy + y, ch, r, g, b);
    }
  }
  // The player as an arrow pointing where they look (8 directions; +y is down on the map).
  const ARROWS = [">", "\\", "v", "/", "<", "\\", "^", "/"];
  const k = Math.round(player.yaw / (Math.PI / 4)) & 7;   // "& 7" wraps negatives too
  put(ox + Math.floor(player.x * 2), oy + Math.floor(player.y), ARROWS[k], 255, 240, 60);
}

let fps = 60, frameMs = 0;
function drawHud() {
  text(1, 0, " STAGE 4 · mouse look & movement ", 255, 255, 255);
  text(1, 1, " WASD move · Shift sprint · Space jump · mouse/arrows look · wheel zoom · 1/2 sensitivity · M map ", 170, 170, 170);
  text(1, 2, ` ${fps.toFixed(0)} fps · ${frameMs.toFixed(1)} ms/frame · ${cols}×${rows} rays · FOV ${fovDeg}° · sens ${(sensitivity * 1000).toFixed(1)} `, 120, 220, 120);
  if (document.pointerLockElement !== canvas) {
    const msg = "  CLICK TO CAPTURE THE MOUSE  ·  Esc releases it  ";
    const x = (cols - msg.length) >> 1, y = (rows >> 1) + 3;
    text(x, y, msg, 255, 230, 120);
  }
}

// ===========================================================================
// 8. The game loop   (now also measures performance)
// ===========================================================================
let lastTime = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (dt > 0) fps += (1 / dt - fps) * 0.05;   // smoothed, so the number doesn't flicker

  update(dt);
  const t0 = performance.now();
  render();
  present();
  frameMs += (performance.now() - t0 - frameMs) * 0.05;

  requestAnimationFrame(frame);
}

resize();
addEventListener("resize", resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
