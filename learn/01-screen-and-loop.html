<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage 1 · Screen and Loop</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
/*
  STAGE 1 — A screen made of coloured characters
  ===============================================
  New in this stage:
    • The "screen" is a grid of cells. Each cell holds ONE character and ONE colour.
      Every frame we fill that grid, then draw the whole grid onto a <canvas>.
    • Brightness → character. A brightness value L from 0 (dark) to 1 (bright) picks a
      character from a "ramp" sorted by how much ink each character uses:
            " .:-=+*#%@"
      The same L also dims the colour, so dark areas are both SPARSER and DARKER.
      That double cue is what makes ASCII renderers read as 3D later on.
    • A game loop (requestAnimationFrame) and keyboard input.

  Why not just ctx.fillText() each character?
    We tried: ~8,000 fillText calls with ~8,000 different colours took ~40 ms per frame
    (25 fps at best). Instead we draw each character ONCE into a tiny bitmap (a "glyph"),
    remember it, and every frame copy glyphs straight into the canvas's pixel memory,
    tinted by the cell's colour. That's ~10 ms per frame, and it stays fast no matter
    how many colours are on screen.

  Every later stage reuses these functions unchanged:
    resize()   – work out how many cells fit in the window
    clear()    – blank the grid
    put()      – set one cell's character + colour
    text()     – write a string into the grid (for the HUD)
    rampChar() – brightness → character
    present()  – draw the grid onto the canvas
*/

// ===========================================================================
// 1. The character screen
// ===========================================================================
const RAMP = " .:-=+*#%@";   // dark → bright. Try " .,-~:;=!*#$@" for a different feel.
const MAX_COLS = 180;         // More columns = more detail, but more work per frame.

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

let cols, rows;      // grid size, in cells
let cellW, cellH;    // size of one cell, in real (device) pixels
let chars;           // chars[i] = the character in cell i   (i = y * cols + x)
let colors;          // colors[i*3 + 0/1/2] = that cell's red / green / blue (0–255)
let image, pixels;   // the canvas's pixel memory, viewed as one 32-bit number per pixel
const glyphs = new Map();   // character → its pre-drawn bitmap

function resize() {
  // Monospace characters are taller than they are wide. Measure by how much.
  ctx.font = "bold 100px monospace";
  const charAspect = ctx.measureText("M").width / 100;   // usually ≈ 0.55–0.6

  // Work in real device pixels (a "1280px" window on a 125% display is 1600 pixels).
  const dpr = window.devicePixelRatio || 1;
  const screenW = Math.floor(window.innerWidth * dpr);
  const screenH = Math.floor(window.innerHeight * dpr);

  cellW = Math.max(6, Math.ceil(screenW / MAX_COLS));
  cellH = Math.round(cellW / charAspect);
  cols = Math.floor(screenW / cellW);
  rows = Math.floor(screenH / cellH);

  canvas.width = cols * cellW;
  canvas.height = rows * cellH;
  canvas.style.width = canvas.width / dpr + "px";
  canvas.style.height = canvas.height / dpr + "px";

  image = ctx.createImageData(canvas.width, canvas.height);
  pixels = new Uint32Array(image.data.buffer);
  glyphs.clear();                                     // cell size changed → redraw glyphs

  chars = new Array(cols * rows).fill(" ");
  colors = new Uint8ClampedArray(cols * rows * 3);   // "Clamped": 300 → 255, -5 → 0
}

function clear() {
  chars.fill(" ");
  colors.fill(0);
}

function put(x, y, ch, r, g, b) {
  if (x < 0 || y < 0 || x >= cols || y >= rows) return;   // off-screen: ignore
  const i = y * cols + x;
  chars[i] = ch;
  colors[i * 3] = r;
  colors[i * 3 + 1] = g;
  colors[i * 3 + 2] = b;
}

function text(x, y, str, r = 220, g = 220, b = 220) {
  for (let k = 0; k < str.length; k++) put(x + k, y, str[k], r, g, b);
}

// Brightness L (0..1) → a character from the ramp.
function rampChar(L) {
  const k = Math.floor(L * RAMP.length);
  return RAMP[Math.max(0, Math.min(RAMP.length - 1, k))];
}

// Draw a character ONCE, white on transparent, and keep how much "ink" each of its
// pixels got (0–255). That's the glyph: a little stencil we can stamp in any colour.
function glyph(ch) {
  let g = glyphs.get(ch);
  if (!g) {
    const c = document.createElement("canvas");
    c.width = cellW;
    c.height = cellH;
    const gctx = c.getContext("2d", { willReadFrequently: true });
    gctx.font = `bold ${cellH}px monospace`;
    gctx.textBaseline = "top";
    gctx.fillStyle = "#fff";
    gctx.fillText(ch, 0, 0);
    const rgba = gctx.getImageData(0, 0, cellW, cellH).data;
    g = new Uint8Array(cellW * cellH);
    for (let k = 0; k < g.length; k++) g[k] = rgba[k * 4 + 3];   // alpha = ink coverage
    glyphs.set(ch, g);
  }
  return g;
}

// Stamp every cell's glyph into the pixel buffer in that cell's colour, then show it.
function present() {
  pixels.fill(0xff000000);                 // opaque black
  const W = canvas.width;
  for (let cy = 0; cy < rows; cy++) {
    for (let cx = 0; cx < cols; cx++) {
      const i = cy * cols + cx;
      const ch = chars[i];
      if (ch === " ") continue;
      const g = glyph(ch);
      const r = colors[i * 3], gr = colors[i * 3 + 1], b = colors[i * 3 + 2];
      let k = 0;
      for (let py = 0; py < cellH; py++) {
        let p = (cy * cellH + py) * W + cx * cellW;       // first pixel of this glyph row
        for (let px = 0; px < cellW; px++, k++, p++) {
          const a = g[k];
          // A pixel is 0xAABBGGRR in memory. Colour × ink amount; ">> 8" ≈ "/ 256".
          if (a) pixels[p] = 0xff000000 | ((b * a >> 8) << 16) | ((gr * a >> 8) << 8) | (r * a >> 8);
        }
      }
    }
  }
  ctx.putImageData(image, 0, 0);
}

// ===========================================================================
// 2. Input: remember which keys are held down right now
// ===========================================================================
// e.code is the PHYSICAL key ("KeyW"), so WASD works on any keyboard layout.
const keys = new Set();
addEventListener("keydown", (e) => keys.add(e.code));
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("blur", () => keys.clear());   // don't keep walking when the tab loses focus

// ===========================================================================
// 3. A tiny world: a top-down map and a player
// ===========================================================================
// Each character is one square "cell" of the world. '.' is empty floor.
const MAP = [
  "####################",
  "#.......#..........#",
  "#.......#...BBBBB..#",
  "#..WW...#...B...B..#",
  "#..WW.......B...B..#",
  "#.......#...BB.BB..#",
  "####.####..........#",
  "#..................#",
  "#..M.....M....#....#",
  "#.............#....#",
  "#..M.....M....#....#",
  "#.........######...#",
  "#..................#",
  "####################",
];
const MAP_W = MAP[0].length, MAP_H = MAP.length;

// Base colour of each kind of wall.
const WALL_COLORS = {
  "#": [150, 150, 165],   // stone
  "B": [200, 90, 60],     // brick
  "W": [170, 115, 60],    // wood
  "M": [90, 170, 95],     // moss
};

function isWall(x, y) {
  const mx = Math.floor(x), my = Math.floor(y);
  if (mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H) return true;
  return MAP[my][mx] !== ".";
}

const player = { x: 2.5, y: 2.5 };
const SPEED = 4;   // map cells per second

// ===========================================================================
// 4. Update: move the player based on held keys
// ===========================================================================
function update(dt) {
  let dx = 0, dy = 0;
  if (keys.has("KeyW") || keys.has("ArrowUp")) dy -= 1;
  if (keys.has("KeyS") || keys.has("ArrowDown")) dy += 1;
  if (keys.has("KeyA") || keys.has("ArrowLeft")) dx -= 1;
  if (keys.has("KeyD") || keys.has("ArrowRight")) dx += 1;
  if (dx === 0 && dy === 0) return;

  // Normalize so diagonal movement isn't faster.
  const len = Math.hypot(dx, dy);
  dx = (dx / len) * SPEED * dt;
  dy = (dy / len) * SPEED * dt;

  // Move one axis at a time: if X is blocked we can still slide along Y.
  if (!isWall(player.x + dx, player.y)) player.x += dx;
  if (!isWall(player.x, player.y + dy)) player.y += dy;
}

// ===========================================================================
// 5. Render: fill the character grid
// ===========================================================================
function render(time) {
  clear();

  // --- Background: an animated "plasma" to show brightness → char + colour ---
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const v = Math.sin(x * 0.07 + time) +
                Math.sin(y * 0.16 - time * 1.3) +
                Math.sin((x + y * 2) * 0.04 + time * 0.6);
      const L = ((v + 3) / 6) * 0.55;            // 0..0.55 — kept dim so the map stands out
      const hue = x * 0.02 + time * 0.3;
      const r = 127 + 127 * Math.sin(hue);
      const g = 127 + 127 * Math.sin(hue + 2.1);
      const b = 127 + 127 * Math.sin(hue + 4.2);
      put(x, y, rampChar(L), r * L, g * L, b * L);
    }
  }

  // --- The map, centred. Each map cell is 2 characters wide, 1 tall,
  //     because characters are about twice as tall as they are wide. ---
  const ox = Math.floor(cols / 2 - MAP_W);
  const oy = Math.floor(rows / 2 - MAP_H / 2);

  for (let my = -1; my <= MAP_H; my++) {           // black frame behind the map
    for (let x = -2; x < MAP_W * 2 + 2; x++) put(ox + x, oy + my, " ", 0, 0, 0);
  }

  for (let my = 0; my < MAP_H; my++) {
    for (let mx = 0; mx < MAP_W; mx++) {
      // The player carries a lantern: brightness falls off with distance.
      const dist = Math.hypot(mx + 0.5 - player.x, my + 0.5 - player.y);
      const L = Math.max(0.3, 1 - dist / 12);

      const cell = MAP[my][mx];
      let ch, r, g, b;
      if (cell === ".") {
        ch = rampChar(L * 0.45);                      // floor: dim, sparse characters
        [r, g, b] = [140, 120, 100];
      } else {
        ch = rampChar(L);                             // walls: dense characters when lit
        [r, g, b] = WALL_COLORS[cell];
      }
      put(ox + mx * 2, oy + my, ch, r * L, g * L, b * L);
      put(ox + mx * 2 + 1, oy + my, ch, r * L, g * L, b * L);
    }
  }

  // The player: 2 columns per map cell, so x has half-cell precision.
  put(ox + Math.floor(player.x * 2), oy + Math.floor(player.y), "@", 255, 230, 80);

  // --- The ramp itself, as a legend ---
  const legendY = oy + MAP_H + 2;
  text(ox, legendY, "brightness 0 → 1:", 160, 160, 160);
  for (let k = 0; k < RAMP.length; k++) {
    const L = (k + 0.5) / RAMP.length;
    put(ox + 19 + k * 2, legendY, RAMP[k], 255 * L, 210 * L, 120 * L);
  }

  // --- HUD ---
  text(1, 0, " STAGE 1 · screen & loop · WASD / arrows to move ", 255, 255, 255);
  text(1, 1, ` grid: ${cols}×${rows} cells (${cols * rows} characters per frame) `, 160, 160, 160);
}

// ===========================================================================
// 6. The game loop
// ===========================================================================
let lastTime = performance.now();
function frame(now) {
  // dt = seconds since the last frame. Movement is "speed × dt", so the game
  // runs at the same speed on a 60 Hz and a 144 Hz monitor.
  // Capped so a long pause (e.g. switching tabs) doesn't teleport the player.
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  render(now / 1000);
  present();
  requestAnimationFrame(frame);
}

resize();
addEventListener("resize", resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
